<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrasi Anggota Ekstrakurikuler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <section class="card registration-card shadow-sm w-100">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 text-center mb-2">Pendaftaran Ekstrakurikuler</h1>
        <p class="text-secondary text-center mb-4">Daftarkan dirimu sebagai anggota baru.</p>

        <form id="registrationForm" novalidate>
          <div class="mb-3">
            <label for="fullName" class="form-label">Nama Lengkap</label>
            <input type="text" class="form-control" id="fullName" placeholder="Masukkan nama lengkap">
            <div class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="nama@email.com">
            <div class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Minimal 8 karakter">
            <div class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Konfirmasi Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Ulangi password">
            <div class="invalid-feedback"></div>
          </div>

          <div class="mb-4">
            <label for="extracurricular" class="form-label">Pilihan Ekstrakurikuler</label>
            <select class="form-select" id="extracurricular">
              <option value="">-- Pilih ekstrakurikuler --</option>
              <option value="Pramuka">Pramuka</option>
              <option value="Paskibra">Paskibra</option>
              <option value="PMR">PMR</option>
              <option value="Futsal">Futsal</option>
              <option value="Basket">Basket</option>
              <option value="Musik">Musik</option>
            </select>
            <div class="invalid-feedback"></div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Daftar Sekarang</button>
          <div id="successMessage" class="alert alert-success mt-3 mb-0 d-none" role="alert">
            Pendaftaran Berhasil!
          </div>
        </form>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
